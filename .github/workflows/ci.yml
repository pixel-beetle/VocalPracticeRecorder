name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Ensure FFmpeg is available for integration tests
        run: |
          $ProgressPreference = "SilentlyContinue"
          $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $cmd) {
            $tmp = Join-Path $env:RUNNER_TEMP "ffmpeg-ci"
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            $zip = Join-Path $tmp "ffmpeg.zip"
            try {
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -TimeoutSec 180
            } catch {
              Write-Warning "gyan.dev 下载失败，改用 BtbN 镜像：$($_.Exception.Message)"
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip -TimeoutSec 180
            }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $extractDir = Join-Path $tmp "extracted"
            [IO.Compression.ZipFile]::ExtractToDirectory($zip, $extractDir)
            $ff = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if (-not $ff) { throw "解压后未找到 ffmpeg.exe" }
            $ff.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$($ff.DirectoryName);$env:PATH"
          }
          ffmpeg -version | Select-Object -First 2

      - name: Build solution
        run: dotnet build VocalPracticeRecorder.sln -c Release

      - name: Run unit and export integration tests
        run: dotnet test tests/VocalPracticeRecorder.Tests -c Release --no-build --verbosity normal
